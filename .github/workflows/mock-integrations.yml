
name: Mock Integration Tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/mock-integrations
permissions:
  contents: read

jobs:
  integration-tests:
    name: FireWatch and FireSim Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch teammate contract branches
        run: |
          git fetch --no-tags origin \
            +refs/heads/feature/firewatch-contract:refs/remotes/origin/feature/firewatch-contract \
            +refs/heads/feature/firesim-contract:refs/remotes/origin/feature/firesim-contract

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integrations
