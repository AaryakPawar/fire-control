
name: Mock Integration Tests

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  integration-tests:
    name: FireWatch and FireSim Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run all contract and integration tests
        run: npm test
