
name: FireSim Contract Tests

on:
  push:
    branches:
      - feature/firesim-contract
  pull_request:
    paths:
      - "contracts/firesim/**"
      - ".github/workflows/firesim-contract-tests.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  test-firesim-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Run FireSim contract tests
        run: npm run test:contracts:firesim
